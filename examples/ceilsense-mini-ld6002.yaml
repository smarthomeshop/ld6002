# Bench example. Use a separately regulated 3.3 V supply for the radar.
# Radar TX0 -> J5 pin 7, GND -> J5 pin 2, P19/BOOT1 -> J5 pin 3.
# J5 pin 1 must be left isolated from the external power supply.
esphome:
  name: ceilsense-mini-ld6002

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

external_components:
  - source:
      type: local
      path: ../components
    components: [ld6002]

uart:
  rx_pin: GPIO1
  baud_rate: 1382400
  rx_buffer_size: 2048

ld6002:
  model: ld6002
  breathing_rate:
    name: "Breathing Rate"
    filters:
      - throttle: 1s
  heart_rate:
    name: "Heart Rate"
    filters:
      - throttle: 1s
