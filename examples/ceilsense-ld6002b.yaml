# CeilSense + HLK-LD6002B example configuration.
#
# Wiring for the ESP32-S3 example:
#   module TX0 -> ESP GPIO15, module RX0 -> ESP GPIO16 (UART, 115200 baud)
#   module P19/BOOT1 -> ESP GPIO4 (must stay LOW in normal operation)
#   module TX2 (raw presence) -> ESP GPIO5

esphome:
  name: ceilsense-ld6002b
  friendly_name: CeilSense LD6002B
  min_version: 2026.8.0
  includes:
    - <driver/gpio.h>
  on_boot:
    # Keep BOOT1 low from the earliest boot stage so the radar starts in
    # normal mode. If the radar still does not boot, verify the pulldown.
    - priority: 1000
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_4, GPIO_MODE_OUTPUT);
            gpio_set_pull_mode(GPIO_NUM_4, GPIO_PULLDOWN_ONLY);
            gpio_set_level(GPIO_NUM_4, 0);
    # The module does not always accept the first command after power-on;
    # enable target display twice with a delay so tracking data reliably
    # starts streaming.
    - priority: -100
      then:
        - delay: 5s
        - switch.turn_on: ld6002b_target_display
        - delay: 10s
        - switch.turn_on: ld6002b_target_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

packages:
  mounting: github://smarthomeshop/radar-mounting/packages/mounting/ceiling.yaml@v1.0.0
  radar_profile: github://smarthomeshop/radar-mounting/packages/radars/ld6002b.yaml@v1.0.0
  radar_ceiling_mode: !include ../packages/ld6002b-ceiling-mode.yaml

logger:
  baud_rate: 115200
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ceilsense-ld6002b"

captive_portal:

web_server:
  port: 80

uart:
  id: uart_ld6002b
  tx_pin: GPIO16
  rx_pin: GPIO15
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

ld6002b:
  id: ld6002b_radar
  uart_id: uart_ld6002b

binary_sensor:
  - platform: gpio
    name: "LD6002B TX2 Raw Presence"
    pin:
      number: GPIO5
      mode:
        input: true
        pulldown: true
    device_class: occupancy
    entity_category: diagnostic

  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target:
      name: "Presence"
    target_1:
      name: "Target 1 Presence"
    target_2:
      name: "Target 2 Presence"
    target_3:
      name: "Target 3 Presence"

sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target_count:
      name: "Target Count"
    point_count:
      name: "Point Count"
      entity_category: diagnostic
    target_1:
      x:
        name: "Target 1 X"
        filters: &target_position_filters
          - throttle_with_priority: 2s
      y:
        name: "Target 1 Y"
        filters: *target_position_filters
      z:
        name: "Target 1 Z"
        filters: *target_position_filters
    target_2:
      x:
        name: "Target 2 X"
        filters: *target_position_filters
      y:
        name: "Target 2 Y"
        filters: *target_position_filters
      z:
        name: "Target 2 Z"
        filters: *target_position_filters
    target_3:
      x:
        name: "Target 3 X"
        filters: *target_position_filters
      y:
        name: "Target 3 Y"
        filters: *target_position_filters
      z:
        name: "Target 3 Z"
        filters: *target_position_filters

text_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    work_mode:
      name: "Work Mode"
      entity_category: diagnostic
    ota_version:
      name: "Radar Firmware Version"
      entity_category: diagnostic

switch:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target_display:
      id: ld6002b_target_display
      name: "Target Display"
      entity_category: config

button:
  - platform: restart
    name: "Restart"
