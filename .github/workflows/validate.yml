name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [ceilsense-ld6002b, ceilsense-mini-ld6002, ceilsense-mini-ld6002c]
    steps:
      - uses: actions/checkout@v5
      - name: Add test secrets
        run: |
          cat > examples/secrets.yaml <<'EOF'
          wifi_ssid: test
          wifi_password: test-password
          EOF
      - name: Compile example
        run: |
          docker run --rm \
            -v "$PWD":/config \
            -w /config \
            esphome/esphome:2026.7.3 \
            compile examples/${{ matrix.example }}.yaml
