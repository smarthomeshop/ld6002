name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - example: ceilsense-ld6002b
            esphome_version: 2026.8.0
          - example: ceilsense-mini-ld6002
            esphome_version: 2026.7.3
          - example: ceilsense-mini-ld6002c
            esphome_version: 2026.7.3
    steps:
      - uses: actions/checkout@v5
      - name: Add test secrets
        run: |
          cat > examples/secrets.yaml <<'EOF'
          wifi_ssid: test
          wifi_password: test-password
          EOF
      - name: Compile example
        run: |
          docker run --rm \
            -v "$PWD":/config \
            -w /config \
            esphome/esphome:${{ matrix.esphome_version }} \
            compile examples/${{ matrix.example }}.yaml
